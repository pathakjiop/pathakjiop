name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"      # every morning
  workflow_dispatch: {}        # run it by hand from the Actions tab
  push:
    paths: ["config.json", "assets/**", "scripts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fonttools pillow
      - name: Fetch contribution + profile data
        run: python scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards (hero, graph, activity, tiles, repos, links)
        run: python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: refresh README cards"
          git push
